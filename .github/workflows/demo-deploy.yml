name: Demo Testing Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  # Run CDK unit tests and linting
  test:
    uses: ./.github/workflows/cdk-test.yml

  # Build Docker images for demo environment
  build-images:
    uses: ./.github/workflows/demo-build.yml
    secrets: inherit

  # Validate production configuration without deploying
  # Runs in parallel with build-images to save time
  validate-prod:
    runs-on: ubuntu-latest
    environment: demo
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-Demo

      - name: Validate CDK Synthesis (Prod Profile)
        run: npm run cdk synth -- --context envType=prod --context stackName=${{ vars.DEMO_STACK_NAME }}

      - name: Validate Change Set
        run: |
          # Check if override is requested
          if [[ "${{ github.event.head_commit.message }}" == *"[force-deploy]"* ]]; then
            echo "🚨 Force deploy detected - skipping change set validation"
          else
            ./scripts/github/validate-changeset.sh TAK-${{ vars.DEMO_STACK_NAME }}-MediaInfra
          fi

  # Deploy demo environment with production configuration for testing
  # Uses built images and runs automated tests
  deploy-and-test:
    runs-on: ubuntu-latest
    # A healthy deploy takes a few minutes plus the testing period. Fail early on a stuck ECS deployment
    # instead of running until the AWS session token expires.
    timeout-minutes: 30
    environment: demo
    needs: [validate-prod, build-images]
    outputs:
      mediamtx-tag: ${{ steps.images.outputs.mediamtx-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-Demo

      - name: Extract Image Tags
        id: images
        run: |
          VERSION=$(jq -r '.context."dev-test".mediamtx.version' cdk.json)
          REVISION=$(jq -r '.context."dev-test".mediamtx.buildRevision' cdk.json)
          
          MEDIAMTX_TAG="mediamtx-${VERSION}-r${REVISION}"
          
          echo "mediamtx-tag=$MEDIAMTX_TAG" >> $GITHUB_OUTPUT
          # The prod window must keep the dev-test instance type. The prod profile's larger type would
          # otherwise be written to the launch template for the length of the window, and an instance
          # launched during it (a health replacement, or the first deploy after a change) would stay
          # that size after the revert: nothing replaces a running instance when the template changes.
          INSTANCE_TYPE=$(jq -r '.context."dev-test".ec2.instanceType' cdk.json)
          echo "instance-type=$INSTANCE_TYPE" >> $GITHUB_OUTPUT
          # The prod task size (2 vCPU, 8 GiB) cannot be placed on the dev-test instance (t4g.large has
          # 8 GiB in total), so the ECS deployment would never stabilise. Keep the dev-test task size too.
          TASK_CPU=$(jq -r '.context."dev-test".ecs.taskCpu' cdk.json)
          TASK_MEMORY=$(jq -r '.context."dev-test".ecs.taskMemory' cdk.json)
          echo "task-cpu=$TASK_CPU" >> $GITHUB_OUTPUT
          echo "task-memory=$TASK_MEMORY" >> $GITHUB_OUTPUT

      - name: Deploy Demo with Prod Profile
        run: npm run cdk deploy -- --context envType=prod --context stackName=${{ vars.DEMO_STACK_NAME }} --context instanceType=${{ steps.images.outputs.instance-type }} --context taskCpu=${{ steps.images.outputs.task-cpu }} --context taskMemory=${{ steps.images.outputs.task-memory }} --context usePreBuiltImages=true --context mediamtxImageTag=${{ steps.images.outputs.mediamtx-tag }} --require-approval never

      - name: Wait for Testing Period
        run: sleep ${{ vars.DEMO_TEST_DURATION || '300' }}

      - name: Run Automated Tests
        run: |
          echo "Placeholder for automated tests"
          # TODO: Add health checks and integration tests
          # Health check URL should be retrieved from MediaInfra stack outputs

  # Always revert demo environment back to dev-test configuration
  # Ensures demo environment is left in a consistent state regardless of test results
  revert-to-dev-test:
    runs-on: ubuntu-latest
    environment: demo
    needs: [deploy-and-test]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup CDK Environment
        uses: ./.github/actions/setup-cdk
        with:
          aws-role-arn: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.DEMO_AWS_REGION }}
          role-session-name: GitHubActions-Demo

      - name: Validate CDK Synthesis (Dev-Test Profile)
        run: npm run cdk synth -- --context envType=dev-test --context stackName=${{ vars.DEMO_STACK_NAME }}

      - name: Revert Demo to Dev-Test Profile
        run: npm run cdk deploy -- --context envType=dev-test --context stackName=${{ vars.DEMO_STACK_NAME }} --context usePreBuiltImages=true --context mediamtxImageTag=${{ needs.deploy-and-test.outputs.mediamtx-tag }} --require-approval never