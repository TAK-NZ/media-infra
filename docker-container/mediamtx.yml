# This Config file is reduced to the min required use case for CloudTAK
# View: https://github.com/bluenviron/mediamtx/blob/main/mediamtx.yml
# For full MediaMTX Config Options

logLevel: info
logDestinations: [stdout]

readTimeout: 30s
writeTimeout: 30s

authMethod: http
authHTTPAddress: http://127.0.0.1:9995/auth
authHTTPExclude: []
authInternalUsers: []

api: yes
apiAddress: :4000
apiEncryption: no
apiAllowOrigins: ['*']
apiTrustedProxies: []

playback: yes
rtsp: yes
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :8554
rtspsAddress: :8322
rtspAuthMethods: [basic]

rtmp: yes
rtmpAddress: :1935
rtmpEncryption: "no"
rtmpsAddress: :1936

hls: yes
hlsAddress: :8888
hlsEncryption: no

# WebRTC signalling is accepted on port 8889 (forwarded from the NLB),
# but ICE media transport requires direct UDP connectivity which is not
# available on Fargate. WebRTC is therefore disabled until migrating to
# EC2 with host networking.
webrtc: no
webrtcAddress: :8889

srt: yes
srtAddress: :8890

pathDefaults:
  rtspDemuxMpegts: yes
